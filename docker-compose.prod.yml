# Production stack: PostgreSQL + API + web/HTTPS proxy.
#   cp .env.production.example .env.production   (fill it in)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Run exactly ONE api container (the API keeps its working data in memory and saves it to the database).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentalhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rentalhub
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentalhub"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://rentalhub:${POSTGRES_PASSWORD}@db:5432/rentalhub
      NODE_ENV: production
      TRUST_PROXY: "1"
    volumes: ["appdata:/data"]
    stop_grace_period: 20s

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
